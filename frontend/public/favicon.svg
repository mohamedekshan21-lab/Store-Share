<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.6" />
  <g transform="translate(14, 14)">
    <polygon points="18,2 34,11 34,29 18,38 2,29 2,11" fill="none" stroke="url(#grad)" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="18" cy="20" r="4.5" fill="#06b6d4" />
    <line x1="18" y1="20" x2="18" y2="4" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" />
    <line x1="18" y1="20" x2="33" y2="28" stroke="#818cf8" stroke-width="2" stroke-dasharray="2 2" />
    <line x1="18" y1="20" x2="3" y2="28" stroke="#a78bfa" stroke-width="2" stroke-dasharray="2 2" />
  </g>
</svg>